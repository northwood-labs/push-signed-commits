---
name: push-signed-commits

description: |
  This action action uses the `createCommitOnBranch` GraphQL endpoint to create verified commits on a remote branch.

  This GraphQL API extracts authorship information from the credential used for authentication, and automatically marks commits created using GitHub App installation credentials as "verified".

inputs:
  github-token:
    description: The GitHub token to use for identity. Ideally, this should come from a GitHub App.
    required: true

  owner:
    description: "Repository owner."
    required: true
    default: ${{ github.repository_owner }}

  repo:
    description: "Repository name."
    required: true
    default: ${{ github.repository }}

  local_branch:
    description: "Local branch name (i.e., running in CI)."
    required: true

  remote_branch:
    description: "Remote branch name (should not include `refs/heads/` prefix or `origin/` prefix)."
    required: true

  remote_name:
    description: "The name of the remote to push to, pre-configured in the local git repo, e.g., `origin`."
    required: true
    default: "origin"

runs:
  using: "composite"
  steps:
    - name: Sign the commit
      shell: bash -euo pipefail
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repo }}
        LOCAL_BRANCH: ${{ inputs.local_branch }}
        REMOTE_BRANCH: ${{ inputs.remote_branch }}
        REMOTE_NAME: ${{ inputs.remote_name }}
      run: |
        go run ${{ github.action_path }}/main.go \
          --owner-repo "$REPO" \
          --local-branch "$LOCAL_BRANCH" \
          --remote-name "$REMOTE_NAME" \
          --remote-branch "$REMOTE_BRANCH" \
          ;

    # The createCommitOnBranch endpoint will dynamically generate authorship and
    # commit verification information, which will result in different commit
    # hashes on the remote vs. local branch.
    #
    # If the creation of remote commits is successful, a final step runs. This
    # step will reset the local branch to have the same authorship info,
    # verification status, and therefore commit hash (which is deterministically
    # derived from commit contents) as the remote.
    - name: Reset the local branch to the remote branch
      if: success()
      env:
        REMOTE_NAME: ${{ inputs.remote_name }}
        REMOTE_BRANCH: ${{ inputs.remote_branch_name }}
      shell: bash
      run: |
        git fetch "${REMOTE_NAME}" "${REMOTE_BRANCH}"
        git reset --hard "${REMOTE_NAME}"/"${REMOTE_BRANCH}"
