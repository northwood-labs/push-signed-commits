# A trimmed subset of GitHub's public GraphQL schema covering the
# createCommitOnBranch mutation, its input objects, and its payload type.
# The field and type names match GitHub's schema exactly so the generated
# request and response types serialize byte-compatibly with the real API.
# Source: https://docs.github.com/en/graphql/reference/mutations#createcommitonbranch

"A string containing a hex-encoded Git object ID (SHA-1 or SHA-256)."
scalar GitObjectID

"A (potentially binary) string encoded using base64."
scalar Base64String

"Represents a Git commit."
type Commit {
  "The Git object ID of the commit."
  oid: GitObjectID!
}

"A ref's name and associated repository, used as a commit target."
input CommittableBranch {
  "The Node ID of the Ref to be updated."
  id: ID

  "The nameWithOwner of the repository to commit to."
  repositoryNameWithOwner: String

  "The unqualified name of the branch to append the commit to."
  branchName: String
}

"A message to attach to a new commit."
input CommitMessage {
  "The headline of the message."
  headline: String!

  "The body of the message."
  body: String
}

"A command to add a file at the given path with the given contents as part of a commit."
input FileAddition {
  "The path in the repository where the file will be located."
  path: String!

  "The base64 encoded contents of the file."
  contents: Base64String!
}

"A command to delete the file at the given path as part of a commit."
input FileDeletion {
  "The path to delete."
  path: String!
}

"A description of a set of changes to a repository's files, performed in a single commit."
input FileChanges {
  "File deletions."
  deletions: [FileDeletion!]

  "File additions."
  additions: [FileAddition!]
}

"Autogenerated input type of CreateCommitOnBranch."
input CreateCommitOnBranchInput {
  "A unique identifier for the client performing the mutation."
  clientMutationId: String

  "The Ref to be updated. Must be a branch."
  branch: CommittableBranch!

  "The commit message the be included with the commit."
  message: CommitMessage!

  "The git commit oid expected at the head of the branch prior to the commit."
  expectedHeadOid: GitObjectID!

  "A description of changes to files in this commit."
  fileChanges: FileChanges
}

"Autogenerated return type of CreateCommitOnBranch."
type CreateCommitOnBranchPayload {
  "A unique identifier for the client performing the mutation."
  clientMutationId: String

  "The new commit."
  commit: Commit
}

"The root query type (required by the schema definition)."
type Query {
  "A placeholder field; the real schema exposes the full GitHub query surface."
  _placeholder: Boolean
}

"The root mutation type."
type Mutation {
  "Creates a new commit, signed by GitHub, onto a branch."
  createCommitOnBranch(input: CreateCommitOnBranchInput!): CreateCommitOnBranchPayload
}

schema {
  query: Query
  mutation: Mutation
}
